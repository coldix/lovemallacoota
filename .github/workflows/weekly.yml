name: Refresh the weekly edition

on:
  schedule:
    # 05:10 UTC daily = 15:10 AEST. The forecast is refreshed every day; the
    # trail and the business only change when the ISO week does.
    - cron: "10 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never race a manual deploy, and never run two refreshes at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh this week's automatic sections
        run: node tools/refresh-weekly.mjs

      - name: Stop here if nothing changed
        id: changed
        run: |
          if git diff --quiet -- data/weekly; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change to this week's automatic content."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A refreshed forecast changes the built files, so the version manifest's
      # checksums have to be rebuilt. The version number is deliberately held:
      # a daily forecast is not a release.
      - name: Rebuild the version manifest at the current version
        if: steps.changed.outputs.changed == 'true'
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          VERSION=$(node -p "require('./data/site-version.json').version")
          pnpm run build
          node tools/update-version.mjs --set="$VERSION"

      - name: Check before publishing
        if: steps.changed.outputs.changed == 'true'
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm run test

      - name: Commit the refreshed edition
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "Love Mallacoota bot"
          git config user.email "coota@lovemallacoota.au"
          git add data/weekly data/site-version.json
          git commit -m "Refresh the weekly forecast and features"
          git push

      # A commit pushed with GITHUB_TOKEN does not trigger another workflow, so
      # the deploy has to happen here or the refresh would never reach the site.
      - name: Deploy lovemallacoota.au
        if: steps.changed.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm run deploy
