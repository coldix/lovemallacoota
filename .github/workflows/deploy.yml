name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Whole history, so the step below can diff across every commit in the
          # push rather than only the last one. A push that carries the Worker's
          # listing commit behind a code commit must still publish.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run check
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Deploy preview
        if: github.event_name == 'push' || inputs.target == 'preview'
        run: pnpm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      # A listing or an article is published by the person who submitted it,
      # after they have confirmed their address with a code. Waiting for a
      # maintainer to deploy makes the site tell them "live in about two
      # minutes" and then do nothing for a day, which reads as a failure and
      # gets retried. Content the Worker commits therefore goes live on its own.
      #
      # [26.09.010] 25/09/2026 AEST: code, styles and photographs now go live on
      # their own too, once "Validate" above has passed. Merges that only
      # touched them sat on the preview site while being reported as live (the
      # Lions Park photographs). A push that changes nothing but notes (docs/,
      # Markdown, tests/, .claude/) still stops at preview.
      - name: Did this push publish content?
        id: content
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            CHANGED="$(git diff --name-only HEAD~1 HEAD)"
          else
            CHANGED="$(git show --name-only --format= HEAD)"
          fi
          echo "Changed in this push:"; echo "$CHANGED"
          # Everything except notes. Held in a variable rather than piped into
          # grep -q, which under pipefail can report a match as a failure.
          SITE_CHANGES="$(echo "$CHANGED" | grep -vE '^(docs/|tests/|\.claude/)|\.md$' || true)"
          if echo "$CHANGED" | grep -qE '^(data/directory/|data/editions/)'; then
            echo "Publishing: this push carries submitted content."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$SITE_CHANGES" ]; then
            echo "Publishing: this push changes the site (code, styles, data or photographs)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing: this push only changes notes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy lovemallacoota.au
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
          || steps.content.outputs.publish == 'true'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
