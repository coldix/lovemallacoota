name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run check

      - name: Deploy preview
        if: github.event_name == 'push' || inputs.target == 'preview'
        run: pnpm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy lovemallacoota.au
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
